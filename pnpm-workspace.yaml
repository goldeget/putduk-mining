packages:
  - .
  - apps/*

allowBuilds:
  unrs-resolver: true
  "esbuild@0.28.1": false
  "esbuild@0.28.2": false
  "workerd@1.20261006.1": false
  "rclone.js@0.6.6": false
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@supabase/auth-js@2.117.2"
  - "@supabase/functions-js@2.117.2"
  - "@supabase/postgrest-js@2.117.2"
  - "@supabase/realtime-js@2.117.2"
  - "@supabase/storage-js@2.117.2"
  - "@supabase/supabase-js@2.117.2"
  - "@types/node@24.19.0"
  - "@vitest/coverage-v8@5.0.2"
  - "@vitest/mocker@5.0.2"
  - "@vitest/spy@5.0.2"
  - framer-motion@13.4.4
  - motion-dom@13.4.4
  - motion@13.4.4
  - vitest@5.0.2
  # Exact integrity-reviewed adapter pins for patched Next 16.4.1.
  - "@opennextjs/cloudflare@1.20.12"
  - "@opennextjs/aws@4.1.11"

# Patch Miniflare's exact vendor pin; Next already uses the fixed sharp.
overrides:
  "miniflare@5.20261006.0-alpha>sharp": "0.35.5"
