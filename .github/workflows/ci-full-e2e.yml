name: Full WORKROOM acceptance
on:
  workflow_dispatch:
  push:
    branches: [main, develop, "release/**"]
permissions:
  contents: read
concurrency:
  group: full-workroom-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
env:
  APP_ENV: test
  NEXT_PUBLIC_APP_ENV: test
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:63421
  NEXT_PUBLIC_CHANNEL_TALK_PLUGIN_KEY: putduk-e2e-plugin-key
  CHANNEL_TALK_MEMBER_HASH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
jobs:
  direct-cash-probe:
    name: WORKROOM direct cash native preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: |
          node scripts/ci-workroom-checkout.mjs
          pnpm install --frozen-lockfile
          node scripts/ci-workroom-cash-native.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workroom-cash-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: test-results/workroom-cash-probe
          if-no-files-found: error
  application:
    name: WORKROOM full application gates
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: |
          node scripts/ci-workroom-checkout.mjs
          pnpm install --frozen-lockfile
          node scripts/ci-workroom-application.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workroom-application-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: test-results/workroom-application
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: workroom-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .next
            apps/admin/.next
            test-results/workroom-application
  acceptance:
    name: WORKROOM full native and authenticated acceptance
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: |
          node scripts/ci-workroom-checkout.mjs
          pnpm install --frozen-lockfile
          node scripts/ci-workroom-browser-server.mjs --start
      - name: Disposable native security, worker and real Auth acceptance
        run: node scripts/ci-workroom-acceptance.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          WORKROOM_EARLY_NATIVE: "1"
          WORKROOM_CI_PROFILE: full
          E2E_WEB_PORT: "3000"
          E2E_ADMIN_HOST: "127.0.0.1"
          E2E_ADMIN_PORT: "3100"
      - name: Stop job-owned browser runtime
        if: always()
        run: node scripts/ci-workroom-browser-server.mjs --stop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workroom-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: |
            test-results/workroom-native
            test-results/workroom-browser-runtime
            test-results/workroom-auth/results.json
            test-results/workroom-auth/retained-results.json
            test-results/workroom-auth/financial-results.json
            test-results/workroom-auth/public-successor-results.json
            test-results/workroom-auth/retained-source/provenance.json
            test-results/workroom-auth/*member-mobile.png
            test-results/workroom-acceptance
            test-results/worker
            test-results/workroom-worker-201
          if-no-files-found: error
  cloudflare-build:
    name: WORKROOM full Cloudflare deploy artifact build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: |
          node scripts/ci-workroom-checkout.mjs
          pnpm install --frozen-lockfile
          node scripts/ci-workroom-cloudflare-build.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: workroom-cloudflare-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          path: |
            .cloudflare/output/v0
            apps/admin/.cloudflare/output/v0
            test-results/workroom-cloudflare-build
      - uses: actions/upload-artifact@v7
        with:
          name: workroom-cloudflare-metadata-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 3
          path: |
            test-results/workroom-cloudflare-build/output-review.json
            test-results/workroom-cloudflare-build/receipt.json
      - uses: actions/upload-artifact@v7
        with:
          name: workroom-cloudflare-compact-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          path: |
            .cloudflare/output/v0
            apps/admin/.cloudflare/output/v0
            test-results/workroom-cloudflare-build
            !.cloudflare/output/v0/workers/default/assets/brand/**
            !.cloudflare/output/v0/workers/default/assets/ranks/**
            !apps/admin/.cloudflare/output/v0/workers/default/assets/brand/**
            !apps/admin/.cloudflare/output/v0/workers/default/assets/ranks/**
  cloudflare-acceptance:
    name: WORKROOM full workerd native and authenticated acceptance
    needs: cloudflare-build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WORKROOM_CI_RUNTIME: workerd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: |
          node scripts/ci-workroom-checkout.mjs
          pnpm install --frozen-lockfile
          node scripts/ci-workroom-browser-server.mjs --start
      - uses: actions/download-artifact@v7
        with:
          name: workroom-cloudflare-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: .
      - name: Disposable native security, worker and real Auth acceptance
        run: node scripts/ci-workroom-acceptance.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_WEB_PORT: "3000"
          E2E_ADMIN_PORT: "3100"
      - name: Stop job-owned browser runtime
        if: always()
        run: node scripts/ci-workroom-browser-server.mjs --stop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workroom-workerd-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: |
            test-results/workroom-native
            test-results/workroom-browser-runtime
            test-results/workroom-auth/results.json
            test-results/workroom-auth/retained-results.json
            test-results/workroom-auth/financial-results.json
            test-results/workroom-auth/public-successor-results.json
            test-results/workroom-auth/retained-source/provenance.json
            test-results/workroom-auth/*member-mobile.png
            test-results/workroom-cloudflare-runtime
            test-results/workroom-acceptance
            test-results/worker
            test-results/workroom-worker-201
          if-no-files-found: error
