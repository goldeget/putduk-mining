name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 변경분만 검사한다. 작업 트리 전체 포맷이나 브랜치 이름은 쓰지 않는다.
  diff-integrity:
    name: Exact diff integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check exact PR diff whitespace and conflict markers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$BASE_SHA" in
            *[!0-9a-fA-F]*|"") echo "invalid base sha" >&2; exit 1 ;;
          esac
          case "$HEAD_SHA" in
            *[!0-9a-fA-F]*|"") echo "invalid head sha" >&2; exit 1 ;;
          esac
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          git diff --check "${BASE_SHA}...${HEAD_SHA}"

  application:
    name: Application gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical brand assets
        run: pnpm assets:verify

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  database:
    name: Database security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start isolated PostgreSQL
        run: pnpm db:start

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Run pgTAP tests
        run: pnpm db:test

      - name: Lint application schemas
        run: pnpm db:lint

      - name: Run security advisors
        run: pnpm db:advisors

  browser:
    name: Browser foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

  # Authenticated suite와 분리된 webServer teardown 증거.
  # full 29 suite를 대체하거나 skip하지 않는다.
  webserver-lifecycle:
    name: WebServer lifecycle probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Probe e2e-web-server process-group teardown
        run: node scripts/run-with-watchdog.mjs 120 -- node scripts/e2e-web-server-lifecycle-harness.mjs

  authenticated:
    name: Authenticated product gates (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [webserver-lifecycle]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: supabase start --yes

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Create ephemeral withdrawal data key
        run: node scripts/write-ephemeral-withdrawal-key.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated browser tests
        # 관리자 출금 E2E는 실제 TOTP 창을 기다린다. shard당 한도를 줄이지 않는다.
        # 186개를 4-way --shard로 나누면 shard당 약 47건이다. 병렬 wall time은 가장 느린 shard 기준.
        timeout-minutes: 45
        run: pnpm test:e2e:authenticated -- --shard=${{ matrix.shard }}/4

      - name: Preserve authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-playwright-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  worker:
    name: Worker runtime gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: supabase start --yes

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Run worker runtime tests
        run: pnpm test:worker

      - name: Preserve worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-runtime
          path: test-results
          if-no-files-found: ignore

  # 공개 화면 감사. 로컬 가짜 키만 쓰고 Supabase는 시작하지 않는다.
  typography-public:
    name: Korean typography public gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public Korean typography
        timeout-minutes: 15
        run: pnpm exec playwright test --config playwright.typography.config.ts

      - name: Assert public typography evidence
        if: always()
        run: node scripts/assert-typography-report.mjs test-results/typography/report.json --passed 75 --screenshots 70 --redact

      - name: Preserve public typography evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typography-public
          path: |
            test-results/typography/report.json
            test-results/typography/**/*.png
          if-no-files-found: ignore

  # 보호 화면 감사. 로컬 Supabase만 쓰고, 빌드 후 next start로 띄운다.
  typography-protected:
    name: Korean typography protected gates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: supabase start --yes

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run protected Korean typography
        timeout-minutes: 20
        run: pnpm exec playwright test --config playwright.typography.protected.config.ts

      - name: Assert protected typography evidence
        if: always()
        run: node scripts/assert-typography-report.mjs test-results/typography-protected/report.json --passed 128 --screenshots 126 --hydration 0 --redact

      - name: Preserve protected typography evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typography-protected
          path: |
            test-results/typography-protected/report.json
            test-results/typography-protected/**/*.png
          if-no-files-found: ignore
