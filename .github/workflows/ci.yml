name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical brand assets
        run: pnpm assets:verify

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  database:
    name: Database security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated PostgreSQL
        run: pnpm db:start

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Run pgTAP tests
        run: pnpm db:test

      - name: Lint application schemas
        run: pnpm db:lint

      - name: Run security advisors
        run: pnpm db:advisors

  browser:
    name: Browser foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

  authenticated:
    name: Authenticated product gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated PostgreSQL
        run: pnpm db:start

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated browser tests
        run: pnpm test:e2e:authenticated

      - name: Preserve authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  worker:
    name: Worker runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated PostgreSQL
        run: pnpm db:start

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Run worker runtime tests
        run: pnpm test:worker

      - name: Preserve worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-runtime
          path: test-results
          if-no-files-found: ignore
