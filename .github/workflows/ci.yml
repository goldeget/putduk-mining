name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-budget:
    name: CI completeness and 20-minute budget
    # Keep the controller alive during ordinary cancellation long enough to
    # verify shutdown. Its loop and job timeout are both bounded.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Canonicalize the approved checkout origin
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "goldeget/putduk-mining"
          checkout_origin="$(git remote get-url origin)"
          case "$checkout_origin" in
            https://github.com/goldeget/putduk-mining|https://github.com/goldeget/putduk-mining.git) ;;
            *) echo "BLOCKED_TARGET_SCOPE: checkout origin mismatch" >&2; exit 1 ;;
          esac
          git remote set-url origin https://github.com/goldeget/putduk-mining.git

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enforce whole-workflow time and complete quality gates
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-wall-clock.mjs

  # PR 변경분만 검사한다. 작업 트리 전체 포맷이나 브랜치 이름은 쓰지 않는다.
  diff-integrity:
    name: Exact diff integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check exact PR diff whitespace and conflict markers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$BASE_SHA" in
            *[!0-9a-fA-F]*|"") echo "invalid base sha" >&2; exit 1 ;;
          esac
          case "$HEAD_SHA" in
            *[!0-9a-fA-F]*|"") echo "invalid head sha" >&2; exit 1 ;;
          esac
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          git diff --check "${BASE_SHA}...${HEAD_SHA}"

  application:
    name: Application gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical brand assets
        run: pnpm assets:verify

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  database:
    name: Database security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start isolated PostgreSQL
        run: pnpm db:start

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Run pgTAP tests
        run: pnpm db:test

      # 두 세션 검사는 커밋이 남는다. 공유 suite 를 오염시키지 않도록
      # 러너의 일회용 DB 를 다시 만든 뒤 그 파일만 실행한다.
      - name: Rebuild disposable database for concurrent approval
        run: pnpm db:reset

      - name: Run two-session deposit approval
        run: supabase test db supabase/tests-concurrent/krw_deposit_concurrent_approval.sql

      - name: Run two-session USDT approval
        run: supabase test db supabase/tests-concurrent/usdt_deposit_concurrent_approval.sql

      - name: Lint application schemas
        run: pnpm db:lint

      - name: Run security advisors
        run: pnpm db:advisors

  browser:
    name: Browser foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm exec playwright test --config playwright.config.ts --fail-on-flaky-tests

  # Authenticated suite와 분리된 webServer teardown 증거.
  # full 29 suite를 대체하거나 skip하지 않는다.
  webserver-lifecycle:
    name: WebServer lifecycle probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Probe e2e-web-server process-group teardown
        run: node scripts/run-with-watchdog.mjs 120 -- node scripts/e2e-web-server-lifecycle-harness.mjs

  # 회원·운영자 production build를 workflow당 1회만 수행한다.
  # authenticated shard와 typography-protected가 동일 산출물을 재사용해 shard당 next dev/중복 build를 막는다.
  e2e-app-build:
    name: E2E production build artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* 는 next build 시 클라이언트 번들에 고정된다. shard 런타임 env만으로는
      # Channel Talk E2E 포트(mock) 키를 바꿀 수 없어 support-channel-talk 스펙이 깨진다.
      - name: Build member and admin apps for E2E
        run: pnpm build
        env:
          APP_ENV: test
          NEXT_PUBLIC_APP_ENV: test
          NEXT_PUBLIC_CHANNEL_TALK_PLUGIN_KEY: putduk-e2e-plugin-key
          CHANNEL_TALK_MEMBER_HASH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Upload E2E production build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-next-production
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next
            apps/admin/.next

  authenticated:
    name: Authenticated product gates (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    needs: [webserver-lifecycle, e2e-app-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download E2E production build
        uses: actions/download-artifact@v7
        with:
          name: e2e-next-production

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: bash scripts/ci-supabase-start.sh

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Create ephemeral withdrawal data key
        run: node scripts/write-ephemeral-withdrawal-key.mjs

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-
            ms-playwright-${{ runner.os }}-

      - name: Install Chromium
        run: |
          if [ -d "$HOME/.cache/ms-playwright" ] && [ -n "$(ls -A "$HOME/.cache/ms-playwright" 2>/dev/null)" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run authenticated browser tests
        # 실제 TOTP 창과 모든 assertion/retry는 유지한다. 중단은 실패이며 통과가 아니다.
        # 186개(chromium + mobile-chrome)를 8-way --shard로 나누면 shard당 약 23건이다. wall time은 가장 느린 shard 기준.
        # CI wall-clock: e2e-app-build 산출물 + E2E_NEXT_START=1 (next start). next dev 금지 — putduk-ci-wall-clock.mdc.
        timeout-minutes: 18
        env:
          E2E_NEXT_START: "1"
        # pnpm run … -- --shard 는 CI에서 playwright 인자 앞에 `--` 가 한 번 더 붙어 shard가 무시된다.
        run: pnpm exec playwright test --config playwright.authenticated.config.ts --shard=${{ matrix.shard }}/8 --fail-on-flaky-tests

      - name: Preserve authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-playwright-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  worker:
    name: Worker runtime gates
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: bash scripts/ci-supabase-start.sh

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Run worker runtime tests
        run: pnpm test:worker

      - name: Preserve worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-runtime
          path: test-results
          if-no-files-found: ignore

  # 공개 화면 감사. 로컬 가짜 키만 쓰고 Supabase는 시작하지 않는다.
  typography-public:
    name: Korean typography public gates
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public Korean typography
        timeout-minutes: 15
        run: pnpm exec playwright test --config playwright.typography.config.ts --fail-on-flaky-tests

      - name: Assert public typography evidence
        if: always()
        run: node scripts/assert-typography-report.mjs test-results/typography/report.json --passed 75 --screenshots 70 --redact

      - name: Preserve public typography evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typography-public
          path: |
            test-results/typography/report.json
            test-results/typography/**/*.png
          if-no-files-found: ignore

  # 보호 화면 감사. 로컬 Supabase만 쓰고, 빌드 후 next start로 띄운다.
  typography-protected:
    name: Korean typography protected gates
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    needs: [e2e-app-build]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download E2E production build
        uses: actions/download-artifact@v7
        with:
          name: e2e-next-production

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: bash scripts/ci-supabase-start.sh

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Export local Supabase env
        run: node scripts/capture-local-supabase-env.mjs

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-
            ms-playwright-${{ runner.os }}-

      - name: Install Chromium
        run: |
          if [ -d "$HOME/.cache/ms-playwright" ] && [ -n "$(ls -A "$HOME/.cache/ms-playwright" 2>/dev/null)" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run protected Korean typography
        timeout-minutes: 18
        env:
          E2E_PREBUILT_APPS: "1"
        run: pnpm exec playwright test --config playwright.typography.protected.config.ts --fail-on-flaky-tests

      - name: Assert protected typography evidence
        if: always()
        run: node scripts/assert-typography-report.mjs test-results/typography-protected/report.json --passed 135 --screenshots 133 --hydration 0 --redact

      - name: Preserve protected typography evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typography-protected
          path: |
            test-results/typography-protected/report.json
            test-results/typography-protected/**/*.png
          if-no-files-found: ignore
