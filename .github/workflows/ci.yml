name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_ENV: test
  NEXT_PUBLIC_APP_ENV: test
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:63421
  NEXT_PUBLIC_CHANNEL_TALK_PLUGIN_KEY: putduk-e2e-plugin-key
  CHANNEL_TALK_MEMBER_HASH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
jobs:
  ci-budget:
    name: CI completeness and 20-minute budget
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: |
          node scripts/ci-workroom-checkout.mjs
          node scripts/ci-workroom-wall-clock.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  diff-integrity:
    name: Exact diff integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git diff --check "$BASE_SHA...$CI_HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  application:
    name: WORKROOM application gates
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: |
          node scripts/ci-workroom-checkout.mjs
          pnpm install --frozen-lockfile
          node scripts/ci-workroom-application.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workroom-application-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: test-results/workroom-application
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: workroom-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .next
            apps/admin/.next
            test-results/workroom-application
  acceptance:
    name: WORKROOM native and authenticated acceptance
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: |
          node scripts/ci-workroom-checkout.mjs
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: workroom-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: .
      - name: Disposable native security, worker and real Auth acceptance
        run: node scripts/ci-workroom-acceptance.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workroom-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CI_HEAD_SHA }}
          path: |
            test-results/workroom-native
            test-results/workroom-auth/results.json
            test-results/workroom-auth/retained-results.json
            test-results/workroom-auth/financial-results.json
            test-results/workroom-auth/public-successor-results.json
            test-results/workroom-auth/retained-source/provenance.json
            test-results/workroom-auth/*member-mobile.png
            test-results/workroom-acceptance
            test-results/worker
          if-no-files-found: error
